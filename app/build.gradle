plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.tts'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tts"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 1. Define the signing configuration to read from GitHub Actions environment
    signingConfigs {
        release {
            storeFile file(System.getenv("SIGNING_KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    // 2. Tell the release build to use the signing config above
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release 
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'com.arthenica:ffmpegkit-audio:6.0-2'
}
